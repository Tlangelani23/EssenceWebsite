<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Essence of the Middle East - Checkout</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #121212;
            --input-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --gold-accent: #d4af37; 
            --gold-hover: #b5952f;
            --border-color: #333;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Montserrat', sans-serif;
            padding-bottom: 50px;
        }

        h1, h2, h3, h4, h5 {
            font-family: 'Playfair Display', serif;
            color: #fff;
        }

        /* Header & Nav */
        .navbar {
            background-color: var(--bg-color);
            border-bottom: 1px solid var(--border-color);
        }
        .brand-logo {
            color: var(--gold-accent);
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            letter-spacing: 1px;
        }
        .nav-icon {
            color: var(--text-color);
            font-size: 1.2rem;
            cursor: pointer;
        }

        /* Typography Utilities */
        .section-title {
            font-size: 3rem;
            margin-bottom: 2rem;
            text-align: center;
        }
        .section-title span {
            font-style: italic;
            color: var(--gold-accent);
        }
        .subtitle {
            color: var(--gold-accent);
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 2px;
            text-align: center;
            display: block;
            margin-bottom: 10px;
        }
        .divider {
            width: 80px;
            height: 1px;
            background-color: var(--gold-accent);
            margin: 0 auto 2rem auto;
        }

        /* Form Elements */
        .form-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #888;
            margin-bottom: 5px;
        }
        .form-control {
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: #fff;
            border-radius: 0;
            padding: 12px;
        }
        .form-control:focus {
            background-color: var(--input-bg);
            border-color: var(--gold-accent);
            box-shadow: none;
            color: #fff;
        }
        .form-control::placeholder {
            color: #555;
        }

        /* Steps Indicator */
        .steps {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }
        .step {
            color: #666;
            font-size: 0.8rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: default;
        }
        .step.active {
            color: var(--gold-accent);
        }

        /* Buttons */
        .btn-gold {
            background-color: var(--gold-accent);
            color: #000;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            border: none;
            border-radius: 0;
            padding: 15px;
            width: 100%;
            transition: all 0.3s ease;
        }
        .btn-gold:hover {
            background-color: var(--gold-hover);
            color: #000;
        }
        .btn-outline-dark-custom {
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: #888;
            text-transform: uppercase;
            letter-spacing: 2px;
            padding: 15px;
            width: 100%;
            border-radius: 0;
        }
        .btn-outline-dark-custom:hover {
            border-color: #fff;
            color: #fff;
        }

        /* Success Page Elements */
        .success-icon {
            font-size: 5rem;
            color: var(--gold-accent);
            margin-bottom: 20px;
        }
        .ref-code {
            font-family: monospace;
            color: var(--gold-accent);
            font-size: 1.1rem;
        }
        .back-link {
            color: #666;
            text-decoration: none;
            font-size: 0.9rem;
            display: inline-block;
            margin-bottom: 2rem;
        }
        .back-link:hover {
            color: #fff;
        }

        /* Order Summary Box (Placeholder) */
        .summary-box {
            border: 1px solid var(--border-color);
            padding: 20px;
            text-align: center;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 30px;
        }
    </style>
</head>
<body>

    
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <a class="navbar-brand brand-logo" href="#">ESSENCE<br><span style="font-size:0.6em; color:#fff; font-family:'Montserrat',sans-serif;">OF THE MIDDLE EAST</span></a>
            <div class="d-flex align-items-center">
                <span class="nav-icon me-3">🛒</span>
                <span class="nav-icon">☰</span>
            </div>
        </div>
    </nav>

    
    <div class="container mt-5">
        
        
        <div id="checkout-section">
            <span class="subtitle">Almost There</span>
            <h1 class="section-title">Delivery <span>Details</span></h1>
            <div class="divider"></div>

            
            <div class="steps">
                <span class="step"><i class="bi bi-box-seam"></i> Cart</span>
                <span class="step active"><i class="bi bi-geo-alt"></i> Delivery</span>
                <span class="step">Confirm</span>
            </div>

            <a href="#" class="back-link ps-0">< BACK TO CART</a>

            <form id="checkout-form">
                
                <h4 class="mb-4" style="font-family: 'Playfair Display', serif;">Contact Information</h4>
                <div class="row g-3">
                    <div class="col-md-12">
                        <label class="form-label">Full Name *</label>
                        <input type="text" class="form-control" > 
                    </div>
                    <div class="col-md-12">
                        <label class="form-label">Email *</label>
                        <input type="email" class="form-control" > 
                    </div>
                    <div class="col-md-12">
                        <label class="form-label">Phone *</label>
                        <input type="tel" class="form-control" > 
                    </div>
                </div>

                
                <h4 class="mt-5 mb-4" style="font-family: 'Playfair Display', serif;">Delivery Address</h4>
                <div class="row g-3">
                    <div class="col-md-12">
                        <label class="form-label">Street Address *</label>
                        <input type="text" class="form-control" > 
                    </div>
                    <div class="col-md-12">
                        <label class="form-label">Apartment / Suite / Complex</label>
                        <input type="text" class="form-control">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">City / Suburb</label>
                        <input type="text" class="form-control" > 
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Postal Code *</label>
                        <input type="text" class="form-control" >
                    </div>
                    <div class="col-md-12">
                        <label class="form-label">Province *</label>
                        <select class="form-control">
                            <option selected>Select province</option>
                            <option>Western Cape</option>
                            <option>Gauteng</option>
                            <option>KwaZulu-Natal</option>
                        </select>
                    </div>
                </div>

                
                <div class="mt-4 mb-5">
                    <label class="form-label">Delivery Notes</label>
                    <textarea class="form-control" rows="3" placeholder="Special delivery instructions..."></textarea>
                </div>

                
                <div class="d-grid gap-3 mb-4">
                    <button type="submit" class="btn btn-gold">
                        Place Order &mdash; R 1
                    </button>
                </div>

                <div class="summary-box">
                    Order Summary
                </div>
            </form>
        </div>

        
        <div id="success-section" class="text-center" style="display: none; padding-top: 50px; padding-bottom: 100px;">
            
            <div class="success-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" fill="currentColor" class="bi bi-check-circle" viewBox="0 0 16 16">
                    <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14zm0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16z"/>
                    <path d="M10.97 4.97a.235.235 0 0 0-.02.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-1.071-1.05z"/>
                </svg>
            </div>
            
            <h2 class="mb-3">Order Placed!</h2>
            <p class="text-secondary mb-2">Thank you for your order. We'll contact you shortly to confirm.</p>
            <p class="text-secondary">Order reference: <span class="ref-code">69FA068E</span></p>

            <div class="row justify-content-center mt-5">
                <div class="col-md-6">
                    <button class="btn btn-gold mb-3">Back to Home</button>
                    <button class="btn btn-outline-dark-custom">Continue Shopping</button>
                </div>
            </div>
        </div>

    </div>

    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    
    <script>
        document.getElementById('checkout-form').addEventListener('submit', function(e) {
            e.preventDefault(); 
            
            
            document.getElementById('checkout-section').style.display = 'none';
            document.getElementById('success-section').style.display = 'block';
            
            
            window.scrollTo(0, 0);
        });
    </script>
</body>
</html>
